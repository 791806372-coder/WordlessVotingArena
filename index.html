<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保险柜 iPhone17 原型</title>
  <style>
    :root {
      --w: 402px;
      --h: 874px;
      --bg: #f4f6fb;
      --card: #fff;
      --line: #edf0f5;
      --text: #171b22;
      --muted: #8a909b;
      --green: #22cdb2;
      --blue: #2d9bf7;
      --deep: #113358;
      --orange: #ff7b3d;
      --yellow: #f8cc37;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: block;
      background: #e9edf4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }
    .screen {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .status {
      height: 50px;
      padding: 22px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 16px;
      font-weight: 800;
      color: #05070a;
      letter-spacing: 0;
    }
    .icons { display: flex; align-items: center; gap: 8px; }
    .status-svg {
      width: 22px;
      height: 18px;
      color: #05070a;
    }
    .battery {
      background: #101214;
      color: #fff;
      border-radius: 6px;
      padding: 0 6px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 800;
    }
    .battery.green { background: #33d45f; }
    .nav {
      height: 56px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
    }
    .modal-nav-access .status,
    .modal-nav-access .nav {
      position: relative;
      z-index: 3;
    }
    .editor-nav {
      height: 56px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 40px 1fr 94px;
      align-items: center;
    }
    .title {
      text-align: center;
      font-size: 23px;
      font-weight: 720;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      padding: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: #15191f;
    }
    .nav-confirm {
      color: #22bda6;
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }
    .content { padding: 0 20px 24px; }
    svg { display: block; }

    /* My page entry */
    .me-bg {
      background:
        radial-gradient(circle at 20% 5%, rgba(253, 207, 255, .72), transparent 28%),
        radial-gradient(circle at 58% 1%, rgba(197, 246, 255, .8), transparent 33%),
        linear-gradient(180deg, #fbfbff 0%, #f3f6fb 56%, #f4f6fb 100%);
    }
    .gear {
      position: absolute;
      right: 38px;
      top: 88px;
      width: 28px;
      height: 28px;
      border: 3px solid #1b1f26;
      border-radius: 9px;
      transform: rotate(30deg);
    }
    .gear:after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 3px solid #1b1f26;
      border-radius: 50%;
    }
    .profile {
      display: grid;
      grid-template-columns: 92px 1fr 28px;
      gap: 18px;
      align-items: center;
      padding: 68px 20px 0;
    }
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #bff3e9;
      position: relative;
      overflow: hidden;
    }
    .avatar:before {
      content: "";
      position: absolute;
      width: 56px;
      height: 44px;
      left: 20px;
      top: 18px;
      border-radius: 55% 45% 42% 45%;
      background: #101214;
      box-shadow: -11px 13px 0 #101214;
    }
    .avatar:after {
      content: "";
      position: absolute;
      width: 58px;
      height: 62px;
      left: 17px;
      bottom: -18px;
      border-radius: 28px 28px 20px 20px;
      background: #fff;
      border: 3px solid #101214;
      border-bottom: 0;
      box-shadow: inset 0 -14px 0 #f7f7f7;
    }
    .person-face {
      position: absolute;
      width: 38px;
      height: 34px;
      left: 28px;
      top: 40px;
      border-radius: 45%;
      background: #fff;
      z-index: 2;
    }
    .person-face:before,
    .person-face:after {
      content: "";
      position: absolute;
      top: 14px;
      width: 4px;
      height: 4px;
      background: #101214;
      border-radius: 50%;
    }
    .person-face:before { left: 11px; }
    .person-face:after { right: 11px; }
    .profile h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
    }
    .verify {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-left: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(199, 250, 240, .84);
      color: #21bfa7;
      font-size: 15px;
      vertical-align: 4px;
      font-weight: 720;
    }
    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .mini-pill {
      padding: 6px 10px;
      border-radius: 12px;
      background: #eef1f5;
      color: #69717e;
      font-size: 14px;
      line-height: 1;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      margin: 46px 0 22px;
    }
    .stats strong {
      display: block;
      font-size: 33px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .stats span {
      color: #606772;
      font-size: 17px;
    }
    .entry-card {
      height: 160px;
      margin: 0 20px 14px;
      border-radius: 16px;
      background: linear-gradient(100deg, #ffffff 0%, #f5fbff 58%, #e8f6ff 100%);
      box-shadow: 0 10px 24px rgba(22, 35, 58, .04);
      position: relative;
      overflow: hidden;
      padding: 22px 20px;
    }
    .entry-card h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
    }
    .entry-card p {
      margin: 0 0 12px;
      color: #6a7180;
      font-size: 15px;
      line-height: 1.35;
      max-width: 190px;
    }
    .blue-btn {
      width: 122px;
      height: 38px;
      border-radius: 22px;
      background: #2d9bf7;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 760;
    }
    .safe-asset {
      position: absolute;
      right: 11px;
      top: 16px;
      width: 144px;
      height: 118px;
      overflow: visible;
    }
    .unlock-safe {
      position: relative;
      inset: auto;
      width: 156px;
      height: 128px;
      margin: 16px auto 6px;
    }
    .menu-card {
      margin: 12px 20px;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }
    .menu-card.single {
      margin-bottom: 14px;
    }
    .menu-row {
      height: 62px;
      display: grid;
      grid-template-columns: 42px 1fr 24px;
      gap: 16px;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #f0f2f6;
      font-size: 20px;
      font-weight: 720;
    }
    .menu-row:last-child { border-bottom: 0; }
    .menu-row span { color: #a0a6af; font-size: 26px; }
    .line-icon {
      width: 28px;
      height: 28px;
      color: var(--orange);
    }
    .line-icon.yellow { color: var(--yellow); }
    .line-icon.green { color: var(--green); }
    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 82px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 -9px 24px rgba(20, 31, 50, .08);
      display: grid;
      grid-template-columns: repeat(3, 1fr) 98px;
      align-items: center;
      padding: 6px 16px 10px;
      border-radius: 18px 18px 0 0;
    }
    .tab {
      text-align: center;
      font-size: 13px;
      color: #20242b;
      font-weight: 700;
      display: grid;
      justify-items: center;
      gap: 4px;
    }
    .tab.active { color: var(--green); }
    .tab svg {
      width: 27px;
      height: 27px;
      color: currentColor;
    }
    .compose {
      position: absolute;
      right: 30px;
      bottom: 26px;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      display: grid;
      place-items: center;
      color: #fff;
    }

    /* Common vault screens */
    .vault-bg { background: #f5f7fb; }
    .security-banner {
      margin: 8px 20px 12px;
      height: 56px;
      border-radius: 14px;
      background: #fff;
      display: grid;
      grid-template-columns: 38px 1fr 18px;
      gap: 10px;
      align-items: center;
      padding: 0 14px;
    }
    .shield {
      width: 30px;
      height: 34px;
      border-radius: 15px 15px 19px 19px;
      background: linear-gradient(160deg, #2fc0ff, #2174e8);
      position: relative;
    }
    .shield:after {
      content: "";
      position: absolute;
      left: 9px;
      top: 11px;
      width: 11px;
      height: 6px;
      border-left: 3px solid #fff;
      border-bottom: 3px solid #fff;
      transform: rotate(-45deg);
    }
    .security-banner strong { font-size: 15px; }
    .security-banner small { display: block; margin-top: 3px; color: #8a909b; font-size: 11px; }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 20px 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      cursor: grab;
      user-select: none;
    }
    .chips.dragging { cursor: grabbing; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      height: 31px;
      padding: 0 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e2e7ee;
      display: grid;
      place-items: center;
      color: #5c6572;
      font-size: 13px;
      white-space: nowrap;
      flex: 0 0 auto;
      position: relative;
    }
    .chip.active { background: #14325b; color: #fff; border-color: #14325b; }
    .chips.managing {
      cursor: default;
      touch-action: pan-x;
    }
    .chips.managing .chip.manageable {
      padding-right: 21px;
      animation: chipWiggle .18s ease-in-out infinite alternate;
      box-shadow: 0 6px 16px rgba(20, 50, 91, .08);
    }
    .chips.managing .chip.manageable:nth-child(2n) {
      animation-delay: .08s;
    }
    .chip-remove {
      position: absolute;
      right: -5px;
      top: -6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.9);
      background: #8c96a5;
      color: #fff;
      font-size: 12px;
      line-height: 14px;
      display: grid;
      place-items: center;
      padding: 0;
      box-shadow: 0 3px 8px rgba(31, 44, 63, .18);
    }
    @keyframes chipWiggle {
      from { transform: rotate(-1.2deg) translateY(0); }
      to { transform: rotate(1.2deg) translateY(-1px); }
    }
    .action.disabled {
      opacity: .38;
      pointer-events: none;
    }
    .list-title {
      padding: 0 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #7b8492;
      font-size: 13px;
    }
    .list-title > span {
      flex: 0 0 auto;
    }
    .list-tools {
      flex: 1;
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }
    .search-pill {
      height: 30px;
      min-width: 54px;
      border-radius: 16px;
      border: 1px solid #e2e7ee;
      background: #fff;
      color: #4c5868;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
    }
    .search-pill svg {
      width: 14px;
      height: 14px;
    }
    .search-pill.expanded {
      width: 172px;
      justify-content: flex-start;
      color: #1f2937;
    }
    .search-input {
      width: 136px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #1f2937;
      font: inherit;
      min-width: 0;
    }
    .filter {
      padding: 6px 10px;
      border-radius: 16px;
      background: #fff;
      color: #4c5868;
      border: 1px solid #e2e7ee;
    }
    .folder-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .folder-delete {
      padding: 6px 10px;
      border-radius: 16px;
      background: #fff4f4;
      color: #d94747;
      border: 1px solid #ffe0e0;
    }
    .vault-list {
      height: calc(var(--h) - 266px);
      overflow-y: auto;
      padding: 0 20px 96px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }
    .vault-list::-webkit-scrollbar { display: none; }
    .vault-row {
      height: 78px;
      border-radius: 16px;
      background: #fff;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 48px 1fr 34px;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
    }
    .vault-row:active,
    .action:active,
    .file-choice:active,
    .media-tile:active {
      transform: scale(.992);
    }
    .thumb {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #e9f3ff;
      position: relative;
      display: grid;
      place-items: center;
      color: #5aa7f7;
      font-size: 20px;
      font-weight: 800;
    }
    .thumb.photo,
    .thumb.video {
      background:
        linear-gradient(135deg, rgba(45,155,247,.18), rgba(34,205,178,.16)),
        radial-gradient(circle at 30% 30%, #ffdf9c, transparent 26%),
        radial-gradient(circle at 72% 28%, #9fd6ff, transparent 28%),
        linear-gradient(135deg, #c7f1e8, #eaf5ff);
      color: transparent;
      overflow: hidden;
    }
    .thumb.photo:after {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 9px;
      height: 15px;
      border-radius: 12px 12px 6px 6px;
      background: rgba(14, 91, 181, .24);
      transform: skewX(-14deg);
    }
    .thumb.lock:before {
      content: "";
      position: absolute;
      width: 21px;
      height: 17px;
      bottom: 10px;
      border-radius: 5px;
      background: #5aa7f7;
    }
    .thumb.lock:after {
      content: "";
      position: absolute;
      width: 18px;
      height: 16px;
      top: 10px;
      border: 3px solid #5aa7f7;
      border-bottom: 0;
      border-radius: 11px 11px 0 0;
    }
    .thumb.media-type {
      background: #eaf4ff;
      color: #4f99ee;
      font-size: 18px;
    }
    .thumb.media-type:after {
      content: "";
      position: absolute;
      right: 7px;
      bottom: 7px;
      width: 12px;
      height: 10px;
      border-radius: 3px;
      background: #5aa7f7;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.5);
    }
    .thumb.stack-type {
      background: #eef6ff;
      color: transparent;
      overflow: visible;
    }
    .thumb.stack-type:before,
    .thumb.stack-type:after {
      content: "";
      position: absolute;
      border-radius: 9px;
      background: #fff;
      border: 1.5px solid rgba(90,167,247,.42);
      box-shadow: 0 8px 18px rgba(68, 126, 194, .14);
    }
    .thumb.stack-type:before {
      width: 29px;
      height: 33px;
      left: 3px;
      top: 10px;
      transform: rotate(-13deg);
      background: #ddecff;
    }
    .thumb.stack-type:after {
      width: 29px;
      height: 33px;
      right: 3px;
      top: 5px;
      transform: rotate(13deg);
      background: linear-gradient(160deg, #ffffff 0 58%, #dff0ff 58% 100%);
    }
    .thumb.stack-type .stack-dot {
      position: absolute;
      z-index: 3;
      width: 12px;
      height: 12px;
      border-radius: 4px;
      left: 17px;
      top: 17px;
      background: #5aa7f7;
      box-shadow: 8px 8px 0 rgba(34, 205, 178, .78);
    }
    .thumb.media-preview {
      background-size: cover;
      background-position: center;
      overflow: hidden;
      color: transparent;
    }
    .thumb.stack-preview {
      background: transparent;
      color: transparent;
      overflow: visible;
    }
    .thumb.stack-preview:before,
    .thumb.stack-preview:after {
      content: "";
      position: absolute;
      border-radius: 10px;
      background: rgba(255,255,255,.86);
      border: 1.5px solid rgba(90,167,247,.34);
      box-shadow: 0 8px 18px rgba(68,126,194,.13);
    }
    .thumb.stack-preview:before {
      width: 31px;
      height: 35px;
      left: 2px;
      top: 10px;
      transform: rotate(-13deg);
      background: #ddecff;
    }
    .thumb.stack-preview:after {
      width: 31px;
      height: 35px;
      right: 2px;
      top: 4px;
      transform: rotate(13deg);
      background: rgba(255,255,255,.92);
    }
    .thumb.stack-preview .stack-photo {
      position: absolute;
      z-index: 3;
      left: 8px;
      top: 6px;
      width: 32px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid #fff;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 22px rgba(42,103,175,.2);
    }
    .thumb.stack-preview.video .stack-photo:after {
      content: "▶";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(17,32,54,.58);
      color: #fff;
      font-size: 8px;
      padding-left: 1px;
      box-sizing: border-box;
    }
    .thumb.media-preview.video:after {
      content: "▶";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(17, 32, 54, .58);
      color: #fff;
      font-size: 10px;
      display: grid;
      place-items: center;
      padding-left: 2px;
      box-sizing: border-box;
      position: absolute;
      right: 6px;
      bottom: 6px;
    }
    .thumb.file.pdf { color: #e25555; background: #fff0f0; }
    .thumb.file.docx { color: #2d7de0; background: #eef6ff; }
    .thumb.file.xlsx { color: #18a76b; background: #eafaf3; }
    .thumb.file.audio { color: #8a63d2; background: #f3efff; }
    .thumb.file.video-file { color: #f08b35; background: #fff5e9; }
    .thumb.file.image-file { color: #4f99ee; background: #eef7ff; }
    .thumb.file.archive { color: #8b6a3d; background: #fff7e8; }
    .thumb.file.cad { color: #6f7a88; background: #f2f4f7; }
    .row-copy { min-width: 0; }
    .row-copy strong {
      display: block;
      font-size: 16px;
      line-height: 20px;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-copy span {
      color: #8a909b;
      display: -webkit-box;
      font-size: 13px;
      line-height: 17px;
      max-height: 34px;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      word-break: break-word;
    }
    .row-copy .summary-text,
    .row-copy .summary-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      -webkit-line-clamp: 1;
    }
    .row-copy .summary-text {
      line-height: 17px;
      max-height: 17px;
    }
    .row-copy .summary-meta {
      color: #6f7f92;
      font-size: 12px;
      line-height: 16px;
      max-height: 16px;
      margin-top: 1px;
    }
    .masked { letter-spacing: 0; }
    .eye { color: #7a8492; }
    .eye-btn {
      width: 40px;
      height: 54px;
      border: 0;
      background: transparent;
      color: #7a8492;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .hint {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 12px;
      z-index: 2;
      margin: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef7ff;
      color: #4f667e;
      font-size: 12px;
    }
    .empty-state {
      margin: 74px 20px 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #8a909b;
    }
    .empty-icon {
      width: 72px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(180deg, #eff7ff, #e8f2ff);
      position: relative;
      margin-bottom: 18px;
    }
    .empty-icon:before {
      content: "";
      position: absolute;
      left: 14px;
      top: 17px;
      width: 44px;
      height: 30px;
      border-radius: 9px;
      background: #5aa7f7;
      opacity: .85;
    }
    .empty-icon:after {
      content: "+";
      position: absolute;
      left: 27px;
      top: 9px;
      color: #fff;
      font-size: 31px;

          return;
        }
        if (!chipDragState) return;
        if (chipDragState.moved) suppressChipClick = true;
        chipDragState.el.classList.remove("dragging");
        chipDragState = null;
        window.setTimeout(() => {
          suppressChipClick = false;
        }, 120);
      });
    });

    app.addEventListener("dragstart", (event) => {
      if (currentScreen === "filePreview") event.preventDefault();
    });

    window.addEventListener("keydown", (event) => {
      if (currentScreen !== "unlock") return;
      if (/^\d$/.test(event.key)) {
        passcodeCount += 1;
        if (passcodeCount >= 6) {
          resetVaultHomeState();
          return go("list");
        }
        return render("unlock", false);
      }
      if (event.key === "Backspace") {
        passcodeCount = Math.max(0, passcodeCount - 1);
        return render("unlock", false);
      }
    });

    window.addEventListener("popstate", () => {
      const nextScreen = new URLSearchParams(location.search).get("screen") || "entry";
      routeStack = [nextScreen];
      render(nextScreen, false);
    });

    render(initialScreen, false);
  </script>
</body>
</html>
