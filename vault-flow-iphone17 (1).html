<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保险柜 iPhone17 原型</title>
  <style>
    :root {
      --w: 402px;
      --h: 874px;
      --bg: #f4f6fb;
      --card: #fff;
      --line: #edf0f5;
      --text: #171b22;
      --muted: #8a909b;
      --green: #22cdb2;
      --blue: #2d9bf7;
      --deep: #113358;
      --orange: #ff7b3d;
      --yellow: #f8cc37;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: block;
      background: #e9edf4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }
    .screen {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .status {
      height: 50px;
      padding: 22px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 16px;
      font-weight: 800;
      color: #05070a;
      letter-spacing: 0;
    }
    .icons { display: flex; align-items: center; gap: 8px; }
    .status-svg {
      width: 22px;
      height: 18px;
      color: #05070a;
    }
    .battery {
      background: #101214;
      color: #fff;
      border-radius: 6px;
      padding: 0 6px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 800;
    }
    .battery.green { background: #33d45f; }
    .nav {
      height: 56px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
    }
    .editor-nav {
      height: 56px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 40px 1fr 94px;
      align-items: center;
    }
    .title {
      text-align: center;
      font-size: 23px;
      font-weight: 720;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      padding: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: #15191f;
    }
    .nav-confirm {
      color: #22bda6;
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }
    .content { padding: 0 20px 24px; }
    svg { display: block; }

    /* My page entry */
    .me-bg {
      background:
        radial-gradient(circle at 20% 5%, rgba(253, 207, 255, .72), transparent 28%),
        radial-gradient(circle at 58% 1%, rgba(197, 246, 255, .8), transparent 33%),
        linear-gradient(180deg, #fbfbff 0%, #f3f6fb 56%, #f4f6fb 100%);
    }
    .gear {
      position: absolute;
      right: 38px;
      top: 88px;
      width: 28px;
      height: 28px;
      border: 3px solid #1b1f26;
      border-radius: 9px;
      transform: rotate(30deg);
    }
    .gear:after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 3px solid #1b1f26;
      border-radius: 50%;
    }
    .profile {
      display: grid;
      grid-template-columns: 92px 1fr 28px;
      gap: 18px;
      align-items: center;
      padding: 68px 20px 0;
    }
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #bff3e9;
      position: relative;
      overflow: hidden;
    }
    .avatar:before {
      content: "";
      position: absolute;
      width: 56px;
      height: 44px;
      left: 20px;
      top: 18px;
      border-radius: 55% 45% 42% 45%;
      background: #101214;
      box-shadow: -11px 13px 0 #101214;
    }
    .avatar:after {
      content: "";
      position: absolute;
      width: 58px;
      height: 62px;
      left: 17px;
      bottom: -18px;
      border-radius: 28px 28px 20px 20px;
      background: #fff;
      border: 3px solid #101214;
      border-bottom: 0;
      box-shadow: inset 0 -14px 0 #f7f7f7;
    }
    .person-face {
      position: absolute;
      width: 38px;
      height: 34px;
      left: 28px;
      top: 40px;
      border-radius: 45%;
      background: #fff;
      z-index: 2;
    }
    .person-face:before,
    .person-face:after {
      content: "";
      position: absolute;
      top: 14px;
      width: 4px;
      height: 4px;
      background: #101214;
      border-radius: 50%;
    }
    .person-face:before { left: 11px; }
    .person-face:after { right: 11px; }
    .profile h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
    }
    .verify {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-left: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(199, 250, 240, .84);
      color: #21bfa7;
      font-size: 15px;
      vertical-align: 4px;
      font-weight: 720;
    }
    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .mini-pill {
      padding: 6px 10px;
      border-radius: 12px;
      background: #eef1f5;
      color: #69717e;
      font-size: 14px;
      line-height: 1;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      margin: 46px 0 22px;
    }
    .stats strong {
      display: block;
      font-size: 33px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .stats span {
      color: #606772;
      font-size: 17px;
    }
    .entry-card {
      height: 160px;
      margin: 0 20px 14px;
      border-radius: 16px;
      background: linear-gradient(100deg, #ffffff 0%, #f5fbff 58%, #e8f6ff 100%);
      box-shadow: 0 10px 24px rgba(22, 35, 58, .04);
      position: relative;
      overflow: hidden;
      padding: 22px 20px;
    }
    .entry-card h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
    }
    .entry-card p {
      margin: 0 0 12px;
      color: #6a7180;
      font-size: 15px;
      line-height: 1.35;
      max-width: 190px;
    }
    .blue-btn {
      width: 122px;
      height: 38px;
      border-radius: 22px;
      background: #2d9bf7;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 760;
    }
    .safe-asset {
      position: absolute;
      right: 11px;
      top: 16px;
      width: 144px;
      height: 118px;
      overflow: visible;
    }
    .unlock-safe {
      position: relative;
      inset: auto;
      width: 156px;
      height: 128px;
      margin: 16px auto 6px;
    }
    .menu-card {
      margin: 12px 20px;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }
    .menu-card.single {
      margin-bottom: 14px;
    }
    .menu-row {
      height: 62px;
      display: grid;
      grid-template-columns: 42px 1fr 24px;
      gap: 16px;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #f0f2f6;
      font-size: 20px;
      font-weight: 720;
    }
    .menu-row:last-child { border-bottom: 0; }
    .menu-row span { color: #a0a6af; font-size: 26px; }
    .line-icon {
      width: 28px;
      height: 28px;
      color: var(--orange);
    }
    .line-icon.yellow { color: var(--yellow); }
    .line-icon.green { color: var(--green); }
    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 82px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 -9px 24px rgba(20, 31, 50, .08);
      display: grid;
      grid-template-columns: repeat(3, 1fr) 98px;
      align-items: center;
      padding: 6px 16px 10px;
      border-radius: 18px 18px 0 0;
    }
    .tab {
      text-align: center;
      font-size: 13px;
      color: #20242b;
      font-weight: 700;
      display: grid;
      justify-items: center;
      gap: 4px;
    }
    .tab.active { color: var(--green); }
    .tab svg {
      width: 27px;
      height: 27px;
      color: currentColor;
    }
    .compose {
      position: absolute;
      right: 30px;
      bottom: 26px;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      display: grid;
      place-items: center;
      color: #fff;
    }

    /* Common vault screens */
    .vault-bg { background: #f5f7fb; }
    .security-banner {
      margin: 8px 20px 12px;
      height: 56px;
      border-radius: 14px;
      background: #fff;
      display: grid;
      grid-template-columns: 38px 1fr 18px;
      gap: 10px;
      align-items: center;
      padding: 0 14px;
    }
    .shield {
      width: 30px;
      height: 34px;
      border-radius: 15px 15px 19px 19px;
      background: linear-gradient(160deg, #2fc0ff, #2174e8);
      position: relative;
    }
    .shield:after {
      content: "";
      position: absolute;
      left: 9px;
      top: 11px;
      width: 11px;
      height: 6px;
      border-left: 3px solid #fff;
      border-bottom: 3px solid #fff;
      transform: rotate(-45deg);
    }
    .security-banner strong { font-size: 15px; }
    .security-banner small { display: block; margin-top: 3px; color: #8a909b; font-size: 11px; }
    .chips {
      display: flex;
      gap: 8px;
      overflow: hidden;
      padding: 0 20px 12px;
    }
    .chip {
      height: 31px;
      padding: 0 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e2e7ee;
      display: grid;
      place-items: center;
      color: #5c6572;
      font-size: 13px;
      white-space: nowrap;
    }
    .chip.active { background: #14325b; color: #fff; border-color: #14325b; }
    .list-title {
      padding: 0 20px 10px;
      display: flex;
      justify-content: space-between;
      color: #7b8492;
      font-size: 13px;
    }
    .filter {
      padding: 6px 10px;
      border-radius: 16px;
      background: #fff;
      color: #4c5868;
      border: 1px solid #e2e7ee;
    }
    .folder-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .folder-delete {
      padding: 6px 10px;
      border-radius: 16px;
      background: #fff4f4;
      color: #d94747;
      border: 1px solid #ffe0e0;
    }
    .vault-list { padding: 0 20px; }
    .vault-row {
      height: 78px;
      border-radius: 16px;
      background: #fff;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 48px 1fr 34px;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
    }
    .vault-row:active,
    .action:active,
    .file-choice:active,
    .media-tile:active {
      transform: scale(.992);
    }
    .thumb {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #e9f3ff;
      position: relative;
      display: grid;
      place-items: center;
      color: #5aa7f7;
      font-size: 20px;
      font-weight: 800;
    }
    .thumb.photo,
    .thumb.video {
      background:
        linear-gradient(135deg, rgba(45,155,247,.18), rgba(34,205,178,.16)),
        radial-gradient(circle at 30% 30%, #ffdf9c, transparent 26%),
        radial-gradient(circle at 72% 28%, #9fd6ff, transparent 28%),
        linear-gradient(135deg, #c7f1e8, #eaf5ff);
      color: transparent;
      overflow: hidden;
    }
    .thumb.photo:after {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 9px;
      height: 15px;
      border-radius: 12px 12px 6px 6px;
      background: rgba(14, 91, 181, .24);
      transform: skewX(-14deg);
    }
    .thumb.lock:before {
      content: "";
      position: absolute;
      width: 21px;
      height: 17px;
      bottom: 10px;
      border-radius: 5px;
      background: #5aa7f7;
    }
    .thumb.lock:after {
      content: "";
      position: absolute;
      width: 18px;
      height: 16px;
      top: 10px;
      border: 3px solid #5aa7f7;
      border-bottom: 0;
      border-radius: 11px 11px 0 0;
    }
    .row-copy strong { display: block; font-size: 16px; margin-bottom: 7px; }
    .row-copy span { color: #8a909b; font-size: 13px; }
    .masked { letter-spacing: 2px; }
    .eye { color: #7a8492; }
    .eye-btn {
      width: 40px;
      height: 54px;
      border: 0;
      background: transparent;
      color: #7a8492;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .hint {
      margin: 10px 20px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef7ff;
      color: #4f667e;
      font-size: 12px;
    }
    .empty-state {
      margin: 74px 20px 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #8a909b;
    }
    .empty-icon {
      width: 72px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(180deg, #eff7ff, #e8f2ff);
      position: relative;
      margin-bottom: 18px;
    }
    .empty-icon:before {
      content: "";
      position: absolute;
      left: 14px;
      top: 17px;
      width: 44px;
      height: 30px;
      border-radius: 9px;
      background: #5aa7f7;
      opacity: .85;
    }
    .empty-icon:after {
      content: "+";
      position: absolute;
      left: 27px;
      top: 9px;
      color: #fff;
      font-size: 31px;
      font-weight: 600;
    }
    .empty-state strong {
      color: #1d2430;
      font-size: 17px;
      margin-bottom: 6px;
    }
    .sheet-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.28);
    }
    .bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-radius: 28px 28px 0 0;
      padding: 14px 20px 26px;
    }
    .grab { width: 42px; height: 4px; border-radius: 99px; background: #d8dde6; margin: 0 auto 16px; }
    .sheet-title { text-align: center; font-size: 18px; font-weight: 760; margin-bottom: 14px; }
    .folder-label {
      font-size: 14px;
      color: #667386;
      margin: 0 0 8px;
    }
    .folder-input {
      width: 100%;
      height: 48px;
      border: 1px solid #e2e7ee;
      border-radius: 14px;
      background: #f8fbff;
      color: #1d2430;
      display: flex;
      align-items: center;
      padding: 0 14px;
      margin-bottom: 8px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }
    .folder-input:focus {
      border-color: #2d9bf7;
      box-shadow: 0 0 0 3px rgba(45,155,247,.12);
    }
    .folder-error {
      min-height: 18px;
      color: #d94747;
      font-size: 12px;
      margin-bottom: 10px;
      opacity: 0;
    }
    .folder-error.show {
      opacity: 1;
    }
    .sheet-primary {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 24px;
      background: #2d9bf7;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 760;
    }
    .action {
      height: 62px;
      border-radius: 15px;
      border: 1px solid #edf0f5;
      background: #fbfdff;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      align-items: center;
      padding: 0 13px;
      margin-bottom: 9px;
    }
    .action-icon {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      background: #eef8ff;
      display: grid;
      place-items: center;
      color: var(--blue);
    }
    .action strong { font-size: 15px; }
    .action small { display: block; color: #8993a1; margin-top: 3px; }
    .limit { text-align: center; color: #8993a1; font-size: 12px; margin-top: 8px; }
    .editor-toolbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: #fff;
      border-top: 1px solid #eef1f5;
      padding: 12px 22px;
    }
    .format-line { height: 34px; display: flex; gap: 20px; color: #5d6775; align-items: center; }
    .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding-top: 16px; }
    .tool { font-size: 13px; color: #4f5966; }
    .tool .tool-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #e9fbf8;
      color: var(--green);
      display: grid;
      place-items: center;
      margin: 0 auto 7px;
    }
    .input-line {
      margin: 0 24px;
      border: 0;
      color: #b0b7c2;
      font-size: 15px;
    }
    .textarea {
      margin: 20px 24px;
      height: 210px;
      color: #b0b7c2;
      font-size: 15px;
    }
    .checkmark { color: #c8ccd2; }
    .editor-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      align-items: center;
      color: #20242b;
    }
    .editor-actions svg {
      width: 21px;
      height: 21px;
    }
    .editor-actions .disabled { color: #c8ccd2; }
    .batch-row {
      grid-template-columns: 28px 48px 1fr;
    }
    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #c9d3e2;
    }
    .check.on { background: var(--blue); border-color: var(--blue); }
    .batch-actions {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .batch-actions div {
      height: 44px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 760;
    }
    .move { background: #e8f3ff; color: #1669bf; }
    .delete { background: #fff0f0; color: #d94747; }
    .detail-card {
      margin: 10px 20px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
    }
    .detail-cover {
      height: 170px;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      display: grid;
      place-items: center;
    }
    .doc-card {
      width: 75px;
      height: 94px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(15,23,42,.1);
    }
    .detail-body { padding: 16px; }
    .detail-body h2 { margin: 0 0 11px; font-size: 22px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .tag { background: #f1f4f8; color: #657180; border-radius: 14px; padding: 6px 9px; font-size: 12px; }
    .detail-text { color: #3b4756; line-height: 1.75; font-size: 15px; }
    .detail-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .detail-imgs div { height: 72px; border-radius: 12px; background: linear-gradient(135deg,#cfe8ff,#fff4c8); }
    .picker-page {
      background: #f5f7fb;
    }
    .picker-grid {
      padding: 16px 20px 88px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .media-tile {
      height: 116px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 28%, rgba(255,226,151,.9), transparent 25%),
        radial-gradient(circle at 76% 23%, rgba(147,210,255,.9), transparent 25%),
        linear-gradient(135deg, #b6eadf, #e9f5ff);
    }
    .media-tile:nth-child(2n) { background: linear-gradient(135deg, #dbeafe, #f7d7df); }
    .media-tile:nth-child(3n) { background: linear-gradient(135deg, #fde68a, #bae6fd); }
    .media-tile.video:after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-40%, -50%);
      border-left: 18px solid rgba(255,255,255,.9);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
    }
    .media-check {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.86);
      background: rgba(0,0,0,.16);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
    }
    .media-tile.on .media-check {
      background: var(--green);
      border-color: var(--green);
    }
    .media-folder-toggle {
      min-height: 52px;
      margin: 0 20px 10px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid #e5ebf2;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
    }
    .media-folder-toggle strong {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .media-folder-toggle span {
      color: #7d8794;
      font-size: 12px;
    }
    .target-folder-row {
      min-height: 52px;
      margin: 0 20px 10px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid #e5ebf2;
      display: grid;
      grid-template-columns: 42px 1fr 18px;
      gap: 10px;

            title: "小于500M文件.zip",
            type: "file",
            folder: fileTargetFolder,
            meta: `ZIP · 128 MB · ${fileTargetFolder} · 今天`,
            body: "文件名：小于500M文件.zip\n大小：128 MB\n状态：已加密保存。"
          });
        }
        fileSelection.clear();
        fileDialog = "";
        selectedFolder = fileTargetFolder;
        selectedType = "all";
        return go("list");
      }
      if (currentScreen === "uploadFolderSheet" && target.closest(".sheet-scrim")) return go(folderPickerReturn);
      if (currentScreen === "uploadFolderSheet" && target.closest("[data-upload-folder]")) {
        uploadTargetFolder = target.closest("[data-upload-folder]").dataset.uploadFolder || "默认";
        if (folderPickerReturn === "mediaPicker") mediaCreateDatedFolder = false;
        return go(folderPickerReturn);
      }
      if (currentScreen === "uploadFolderSheet" && target.closest("[data-action='new-upload-folder']")) {
        folderCreateMode = "upload";
        folderDraft = "";
        folderError = "";
        return go("folderCreate");
      }
      if (currentScreen === "folderCreate" && target.closest(".sheet-scrim")) {
        folderDraft = "";
        folderError = "";
        const returnScreen = folderCreateMode === "upload" ? folderPickerReturn : "list";
        folderCreateMode = "list";
        return go(returnScreen);
      }
      if (currentScreen === "folderCreate" && target.closest("[data-action='confirm-folder']")) {
        const folderName = normalizeFolderName(folderDraft);
        if (!folderName) {
          folderError = "请输入文件夹名称";
          return render("folderCreate", false);
        }
        if (folderName === "全部" || folderExists(folderName)) {
          folderError = "已有同名文件夹";
          return render("folderCreate", false);
        }
        folders.push(folderName);
        if (folderCreateMode === "upload") {
          uploadTargetFolder = folderName;
          if (folderPickerReturn === "mediaPicker") mediaCreateDatedFolder = false;
          folderCreateMode = "list";
          folderDraft = "";
          folderError = "";
          return go(folderPickerReturn);
        }
        selectedFolder = folderName;
        selectedType = "all";
        folderDraft = "";
        folderError = "";
        return go("list");
      }
      if (currentScreen === "typeSheet" && target.closest(".sheet-scrim")) return go("list");
      if (currentScreen === "typeSheet" && target.closest("[data-type-filter]")) {
        selectedType = target.closest("[data-type-filter]").dataset.typeFilter;
        return go("list");
      }
      if (currentScreen === "editor" && target.closest(".editor-actions")) {
        if (editorSource === "add") {
          const folder = uploadTargetFolder || targetContentFolder();
          ensureFolder(folder);
          if (!items.some(item => item.id === `text-${folder}`)) {
            items.unshift({
              id: `text-${folder}`,
              title: "私密图文",
              type: "text",
              folder,
              meta: `图文 · 0字 · 0张图 · ${folder} · 今天`,
              body: "刚刚保存的图文内容，支持文字与最多 9 张图。"
            });
          }
          selectedFolder = folder;
          selectedType = "all";
          return go("list");
        }
        return go("detail");
      }
      if (currentScreen === "detail" && target.closest(".nav-right")) return go("detailMenu");
      if (currentScreen === "detailMenu" && target.closest(".sheet-scrim")) return go("detail");
      if (currentScreen === "detailMenu" && target.closest(".action")) {
        const text = target.closest(".action").textContent;
        if (text.includes("编辑")) {
          editorSource = "edit";
          return go("editor");
        }
        if (text.includes("重命名")) {
          const item = items.find(entry => entry.id === activeItemId);
          renameDraft = item?.title || "";
          renameError = "";
          return go("renameSheet");
        }
        if (text.includes("移动")) {
          moveSource = "detail";
          return go("moveFolder");
        }
        if (text.includes("删除")) {
          deleteSource = "detail";
          return go("deleteConfirm");
        }
        return go("detail");
      }
      if (currentScreen === "batch" && target.closest(".move")) {
        moveSource = "batch";
        return go("moveFolder");
      }
      if (currentScreen === "batch" && target.closest(".delete")) {
        deleteSource = "batch";
        return go("deleteConfirm");
      }
      if (currentScreen === "moveFolder" && target.closest(".sheet-scrim")) return go("list");
      if (currentScreen === "moveFolder" && target.closest("[data-move-folder]")) {
        const folderName = target.closest("[data-move-folder]").dataset.moveFolder || "默认";
        if (!folders.includes(folderName)) return go("list");
        const ids = moveSource === "detail" ? [activeItemId] : batchSelectedIds;
        moveItemsToFolder(ids, folderName);
        return go("list");
      }
      if (currentScreen === "renameSheet" && target.closest(".sheet-scrim")) return go("detailMenu");
      if (currentScreen === "renameSheet" && target.closest("[data-action='confirm-rename']")) {
        const nextTitle = normalizeFolderName(renameDraft);
        if (!nextTitle) {
          renameError = "请输入标题名称";
          return render("renameSheet", false);
        }
        const item = items.find(entry => entry.id === activeItemId);
        if (item) item.title = nextTitle;
        renameDraft = "";
        renameError = "";
        return go("detail");
      }
    });

    app.addEventListener("pointerdown", (event) => {
      if (!(currentScreen === "list" || currentScreen === "reveal")) return;
      if (event.target.closest(".eye-btn")) return;
      if (!event.target.closest(".vault-row")) return;
      clearTimeout(pressTimer);
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        go("batch");
      }, 520);
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach((type) => {
      app.addEventListener(type, () => clearTimeout(pressTimer));
    });

    window.addEventListener("keydown", (event) => {
      if (currentScreen !== "unlock") return;
      if (/^\d$/.test(event.key)) {
        passcodeCount += 1;
        if (passcodeCount >= 6) return go("list");
        return render("unlock", false);
      }
      if (event.key === "Backspace") {
        passcodeCount = Math.max(0, passcodeCount - 1);
        return render("unlock", false);
      }
    });

    window.addEventListener("popstate", () => {
      const nextScreen = new URLSearchParams(location.search).get("screen") || "entry";
      routeStack = [nextScreen];
      render(nextScreen, false);
    });

    render(initialScreen, false);
  </script>
</body>
</html>
